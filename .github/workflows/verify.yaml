name: Verify migration
on:
  pull_request:
  push:
    branches: [main, 'migration/**']
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build:wasm
      - name: Install local Compute runner
        run: npm install --no-save @fastly/cli
      - name: Build runtime smoke test
        run: npx js-compute-runtime test/runtime-smoke.js bin/smoke.wasm
      - name: Exercise WebCrypto and authentication in Viceroy
        run: node scripts/runtime-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cug-gateway-wasm
          path: bin/main.wasm
          retention-days: 7
